[package]
name = "the-hayatabad-model-school"
version = "1.0.0"
description = "Official Windows Desktop Admin Application for The Hayatabad Model School ERP"
authors = ["The Hayatabad Model School IT"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "http-all", "fs-all", "dialog-all", "window-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
